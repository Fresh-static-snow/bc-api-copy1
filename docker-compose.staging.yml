services:
  maincast-calendar-ruby: &maincast-calendar-ruby
    image: ghcr.io/${REPOSITORY_OWNER_LOWERCASE}/${REPOSITORY_NAME_LOWERCASE}:latest
    container_name: maincast-calendar-ruby
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - ./.env
    network_mode: host
    command: /bin/sh -c "bundle exec rails db:migrate"

  maincast-calendar-api:
    <<: *maincast-calendar-ruby
    container_name: maincast-calendar-api
    command: /bin/sh -c "rm -f tmp/pids/server.pid && bundle exec rails s -p ${PORT} -b '0.0.0.0'"

  maincast-calendar-sidekiq:
    <<: *maincast-calendar-ruby
    container_name: maincast-calendar-sidekiq
    command: bundle exec sidekiq

  maincast-calendar-discord-bot:
    <<: *maincast-calendar-ruby
    container_name: maincast-calendar-discord-bot
    env_file:
      - ./.env
    command: /bin/sh -c "bundle exec ruby ./bin/discord_bot_ctl restart"

  maincast-calendar-telegram-bot:
    <<: *maincast-calendar-ruby
    container_name: maincast-calendar-telegram-bot
    env_file:
      - ./.env
    command: /bin/sh -c "bundle exec ruby ./bin/telegram_bot_ctl restart"