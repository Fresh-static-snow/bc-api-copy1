services:
  maincast-calendar-ruby: &maincast-calendar-ruby
    image: ghcr.io/${REPOSITORY_OWNER_LOWERCASE}/${REPOSITORY_NAME_LOWERCASE}:latest
    container_name: maincast-calendar-ruby
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - ./.env
    network_mode: host

  maincast-calendar-api:
    <<: *maincast-calendar-ruby
    container_name: maincast-calendar-api
    command: /bin/sh -c "rm -f tmp/pids/server.pid && bundle exec rails s -p ${PORT} -b '0.0.0.0'"

  maincast-calendar-sidekiq:
    <<: *maincast-calendar-ruby
    container_name: maincast-calendar-sidekiq
    command: bundle exec sidekiq
